# Base compose: local Postgres and auth-less Phoenix for development.
#
# `bun run dev` starts these and then runs the bot against them. Production
# extends this file with docker-compose.prod.yml (see `bun run prod`).
name: umbrella

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: umbrella
      POSTGRES_PASSWORD: umbrella
      POSTGRES_DB: umbrella
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umbrella"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "${PHOENIX_PORT:-6006}:6006" # UI + OTLP HTTP collector
      - "4317:4317" # OTLP gRPC collector
    environment:
      PHOENIX_WORKING_DIR: /mnt/phoenix
      PHOENIX_TELEMETRY_ENABLED: "false"
      # Auth is off by default so `bun run dev` needs no credentials. Production
      # overrides this in docker-compose.prod.yml.
      PHOENIX_ENABLE_AUTH: "${PHOENIX_ENABLE_AUTH:-false}"
    volumes:
      - phoenix-data:/mnt/phoenix

volumes:
  postgres-data:
  phoenix-data:
